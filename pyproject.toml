[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwh-isaaclab-tasks"
version = "0.1.0"
description = "IsaacLab simulation tasks for the LWH SO101 workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "isaaclab==0.41.3",
    "isaaclab-tasks==0.10.36",
]

[tool.setuptools.packages.find]
where = ["source/lwh_isaaclab_tasks"]

[tool.setuptools.package-data]
lwh_isaaclab_tasks = [
    "assets/robots/*.usd",
    "assets/props/*.usd",
    "assets/props/Materials/Textures/*.png",
    "policy/transport/*.proto",
]
