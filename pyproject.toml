[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwh-isaaclab-tasks"
version = "0.1.0"
description = "IsaacLab simulation tasks for the LWH SO101 workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "isaaclab==0.41.3",
    "isaaclab-tasks==0.10.36",
    "leisaac==0.4.0",
]

[tool.setuptools.packages.find]
where = ["source/lwh_isaaclab_tasks"]

